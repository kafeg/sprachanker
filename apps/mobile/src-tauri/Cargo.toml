[package]
name = "sprachanker-mobile"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sprachanker_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
cc = "1"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
# The listener other devices open the app at (src/host.rs): the versions Tauri already takes.
tokio = { version = "=1.53.3", features = ["net", "rt", "sync"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"

[profile.release]
opt-level = 3
