[package]
name = "sprachanker-mobile"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sprachanker_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
cc = "1"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
bzip2 = "=0.4.4"
tar = "=0.4.46"

[profile.release]
opt-level = 3
