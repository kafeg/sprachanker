<!doctype html>
<!-- What the window shows while the server starts (main.rs then opens the server's page), or why it
     could not start: the message after the address's #. Colours: the web app's tokens
     (apps/web/src/styles.css). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SprachAnker</title>
    <style>
      :root {
        --background: oklch(0.985 0.004 95);
        --foreground: oklch(0.22 0.01 260);
        --primary: oklch(0.86 0.17 92);
        --muted-foreground: oklch(0.5 0.012 260);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.17 0.008 260);
          --foreground: oklch(0.94 0.005 95);
          --primary: oklch(0.84 0.16 92);
          --muted-foreground: oklch(0.7 0.01 260);
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { display: grid; justify-items: center; gap: 20px; padding: 0 24px; max-width: 34rem; }
      h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid color-mix(in oklch, var(--primary) 25%, transparent);
        border-top-color: var(--primary);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
      #message { margin: 0; text-align: center; color: var(--muted-foreground); -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <main>
      <h1>SprachAnker</h1>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <p id="message" role="status" dir="auto" hidden></p>
    </main>
    <script>
      const message = decodeURIComponent(location.hash.slice(1));
      if (message) {
        document.getElementById("spinner").hidden = true;
        const line = document.getElementById("message");
        line.textContent = message;
        line.hidden = false;
      }
    </script>
  </body>
</html>
