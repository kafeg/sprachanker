name: Engines

# Each speech engine built at its pinned version (native/<engine>/VERSION) for each system the
# releases have — Macs with Apple Silicon, Windows and Linux on x64 — and kept as a pre-release of its
# own (`bun native/scripts/tag.ts <engine>` names it), a file per system; a system's file is built only
# while the release lacks it. The Release workflow takes the engines from there.
on:
  push:
    branches: [main]
    paths: ["native/**", "packages/server/src/runtime/engines.ts", ".github/workflows/engines.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        engine: [whisper, piper, qwen]
        runner: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2; Bun from packageManager in package.json
      - name: Its release and file
        id: release
        run: |
          info=$(bun native/scripts/tag.ts ${{ matrix.engine }})
          tag=$(jq -r .tag <<<"$info"); file=$(jq -r .file <<<"$info")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r .out <<<"$info")/$file" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$file"; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.have != '1'
        run: bun native/scripts/build.ts ${{ matrix.engine }}
      # The three systems' jobs share the release: whichever comes first makes it.
      - if: steps.release.outputs.have != '1'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --prerelease --title "$tag" \
              --notes "A speech engine of SprachAnker, a file per system: Macs with Apple Silicon (macOS 13 and later), Windows and Linux on x64 (a CPU with AVX2)." ||
            gh release view "$tag" >/dev/null
          gh release upload "$tag" "${{ steps.release.outputs.path }}" --clobber
